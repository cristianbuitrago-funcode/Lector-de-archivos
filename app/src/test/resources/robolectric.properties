# SDK 35: la imagen de Android 16 de Robolectric incluye una copia antigua de Apache Commons Compress
# (del código de servicios del sistema) que choca con la de la app. En un dispositivo real esas clases no
# están en el classpath de las apps; el CI lo comprueba en emuladores Android 8.0, 15 y 16.
sdk=35
# Un solo modo gráfico para todas las pruebas: Robolectric crea un entorno (con su cargador de clases) por cada
# combinación de opciones, y la biblioteca nativa de tree-sitter solo puede cargarse en uno por proceso. Con modos
# distintos, las pruebas del segundo entorno analizaban sin gramáticas según el orden de ejecución.
graphicsMode=NATIVE

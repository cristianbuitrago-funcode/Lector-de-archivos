# Integración continua de Funcode Code Analyzer.
# Las acciones se fijan por SHA de commit (con la versión en el comentario) para evitar cambios inesperados.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilación, pruebas JVM y Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Pruebas JVM, Lint y compilación de los APK
        run: ./gradlew test lint assembleDebug assembleDebugAndroidTest :app:assembleRelease --stacktrace

      - name: APK de prueba (para instalar en el teléfono)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: funcode-analyzer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Informes de pruebas y Lint
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-jvm
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14

  instrumented:
    name: Pruebas en emulador (API ${{ matrix.api-level }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 26 = versión mínima admitida (detección del proceso aislado por UID); 35 y 36 = versiones recientes.
        api-level: [26, 35, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Se compila antes de arrancar el emulador: las bibliotecas nativas (UnRAR y tree-sitter) tardan varios minutos.
      - name: Compilar los APK de prueba
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pruebas instrumentadas (aislamiento, cifrado y recorrido completo)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # Si fallan, se guarda el registro del emulador (incluye los fallos del proceso aislado).
          script: ./gradlew connectedDebugAndroidTest --stacktrace || (adb logcat -d > emulator-logcat.txt; exit 1)

      - name: Informes de pruebas instrumentadas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-emulador-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/connected_android_test_additional_output/
            emulator-logcat.txt
          retention-days: 14

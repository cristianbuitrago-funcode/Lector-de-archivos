# Catálogo de tecnologías de Funcode Code Analyzer.
#
# Cada tecnología se reconoce por señales con un peso. La puntuación es la suma de los pesos de las señales
# distintas que aparecen (máximo 1). Con `confirmed` (0.8 por defecto) o más es "confirmada"; con `probable`
# (0.5) o más, "probable"; por debajo, "posible" (indicio débil).
#
# Señales:
#   dependency  nombre del paquete declarado (`prefijo*` para una familia); `ecosystem` lo limita
#               (npm, composer, jvm = Gradle o Maven, python, pub, nuget, go, cargo, rubygems, cocoapods, cmake,
#               unity, unreal). Peso por defecto 0.8.
#   file        nombre de archivo o final de ruta, con `*` como comodín. Peso por defecto 0.5.
#   import      módulo importado en el código (ese módulo o un submódulo); `languages` lo limita. Peso 0.6.
#   content     texto literal en el código (fuera de comentarios); `in` limita las extensiones. Peso 0.4.
#   pattern     expresión RE2 con `hint` (texto literal que debe aparecer antes de evaluarla). Peso 0.4.
#
# `version: false` en una dependencia: su versión no es la de la tecnología (p. ej. el complemento de Gradle de
# Android). Un texto o patrón encontrado solo en archivos de prueba suma la mitad de su peso.
#
# `mentions`: textos que, en documentación o comentarios, se listan como "menciones no concluyentes".
# Las menciones, los archivos de bloqueo y las dependencias transitivas NUNCA suman puntuación.
version: 1
